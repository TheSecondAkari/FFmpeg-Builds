name: Build FFmpeg (macOS Universal)on:  push:    paths-ignore:      - '**.md'      - 'LICENSE'  workflow_dispatch:    inputs:      doRelease:        description: 'Publish new release'        type: boolean        default: false        required: falsejobs:  build_x64:    name: Build macOS x86_64    runs-on: macos-14    steps:      - name: Checkout        uses: actions/checkout@v7      - name: Install dependencies        run: |          brew install nasm pkg-config      - name: Load config and download FFmpeg        run: |          set -euo pipefail          source ffmpeg-custom-config.sh          echo "FFmpeg version: $FFMPEG_VERSION"          curl -L -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"          tar xf ffmpeg.tar.xz          mv "ffmpeg-${FFMPEG_VERSION}" ffmpeg      - name: Configure        run: |          set -euo pipefail          source ffmpeg-custom-config.sh          cd ffmpeg          ./configure $FF_CONFIGURE \            --arch=x86_64 \            --cc=clang \            --extra-cflags="-arch x86_64 -mmacosx-version-min=10.15" \            --extra-ldflags="-arch x86_64 -mmacosx-version-min=10.15" \            --prefix="${GITHUB_WORKSPACE}/output-x64"      - name: Build        run: |          set -euo pipefail          cd ffmpeg          echo "=== Starting make ==="          set +e          make -j1 > build.log 2>&1          MAKE_EXIT=$?          set -e          echo "=== make exit code: $MAKE_EXIT ==="          if [ $MAKE_EXIT -ne 0 ]; then            echo "=== make failed! Last 100 lines of build.log ==="            tail -100 build.log            exit $MAKE_EXIT          fi          echo "=== make install ==="          make install          echo "=== Checking binaries ==="          ls -lh "${GITHUB_WORKSPACE}/output-x64/bin/"          test -f "${GITHUB_WORKSPACE}/output-x64/bin/ffmpeg"
