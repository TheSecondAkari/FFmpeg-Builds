name: Build FFmpeg (Windows)

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      doRelease:
        description: 'Publish new release'
        type: boolean
        default: false
        required: false

jobs:
  build_win64:
    name: Build Windows x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nasm pkg-config zip

      - name: Load config and download FFmpeg
        run: |
          set -e
          source ffmpeg-custom-config.sh
          echo "FFmpeg version: $FFMPEG_VERSION"
          curl -L -o ffmpeg.tar.xz "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          tar xf ffmpeg.tar.xz
          mv "ffmpeg-${FFMPEG_VERSION}" ffmpeg

      - name: Configure
        run: |
          set -e
          source ffmpeg-custom-config.sh
          cd ffmpeg
          ./configure $FF_CONFIGURE \
            --arch=x86_64 \
            --target-os=mingw32 \
            --cross-prefix=x86_64-w64-mingw32- \
            --prefix="${GITHUB_WORKSPACE}/output-win64"

      - name: Build
        run: |
          set -e
          cd ffmpeg
          make -j$(nproc)
          make install

      - name: Verify and package
        run: |
          set -e
          ls -lh output-win64/bin/
          file output-win64/bin/ffmpeg.exe output-win64/bin/ffprobe.exe
          mkdir -p pkg
          cp output-win64/bin/ffmpeg.exe output-win64/bin/ffprobe.exe pkg/
          cd pkg
          zip -r "${GITHUB_WORKSPACE}/ffmpeg-win64.zip" ffmpeg.exe ffprobe.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-win64
          path: ffmpeg-win64.zip

      - name: Test run (with wine)
        run: |
          sudo apt-get install -y wine64
          wine64 pkg/ffmpeg.exe -version || true
          wine64 pkg/ffprobe.exe -version || true

  publish_release:
    name: Publish release
    if: ${{ !cancelled() && github.event.inputs.doRelease == 'true' && needs.build_win64.result == 'success' }}
    needs: build_win64
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-win64
          path: release
      - name: Create release
        run: |
          set -xe
          RELDATE="$(date +'%Y-%m-%d %H:%M')"
          NAME="Windows Build $RELDATE"
          TAGNAME="win-build-$(date +'%Y-%m-%d-%H-%M')"
          (cd release && sha256sum *.zip > checksums.sha256)
          gh release create "$TAGNAME" --target "master" --title "$NAME" --notes "Windows FFmpeg build (ffmpeg + ffprobe)" release/*.zip release/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ github.token }}
